# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: gonogo/nosetonose
  branch: main
  base_url: https://christopher-neale-f49.workers.dev

site_url: https://nosetonose.christopher-neale-f49.workers.dev
display_url: https://nosetonose.christopher-neale-f49.workers.dev
# site_url: http://localhost:5173
# display_url: http://localhost:5173
logo_url: /favicon.svg

media_folder: static/media
public_folder: /media

# JSON null on an unused single relation blanks the whole entry editor.
# Omit those keys instead; this option stops the CMS writing them back as null.
output:
  omit_empty_optional_fields: true
  json:
    indent_style: space
    indent_size: 2

collections:
  - name: course-types
    label: Course types
    label_singular: Course type
    icon: school
    folder: src/lib/data/course-types
    create: true
    format: json
    extension: json
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [title, clown_level, medium]
    view_filters:
      - { label: In-person, field: medium, pattern: In-person }
      - { label: Online, field: medium, pattern: Online }
    fields:
      - { label: ID, name: id, widget: string, hint: 'Stable slug used by course listings, e.g. courage-to-be-clown-1. Set the entry slug to the same value.' }
      - { label: Title, name: title, widget: string, hint: 'Date-agnostic programme name, e.g. Courage to Be – Clown Level 1' }
      - { label: Clown level, name: clown_level, widget: string, required: false, hint: 'e.g. Clown 1, Masterclass, Introduction' }
      - { label: Prerequisites, name: prerequisites, widget: string, required: false }
      - label: Medium
        name: medium
        widget: select
        options: [In-person, Online]
        default: In-person
      - { label: Maximum group size, name: maximum_group_size, widget: number, value_type: int, min: 1, required: false }
      - { label: Course fee, name: course_fee, widget: string, required: false }
      - { label: Deposit, name: course_fee_deposit, widget: string, required: false }
      - label: Facilitators
        name: facilitators
        widget: relation
        multiple: true
        required: false
        collection: people
        value_field: id
        search_fields: [name]
        display_fields: [name]
      - { label: Schedule, name: schedule, widget: text, required: false }
      - { label: Course description, name: course_description, widget: text, required: false }

  - name: courses
    label: Courses
    label_singular: Course
    icon: event
    folder: src/lib/data/courses
    create: true
    format: json
    extension: json
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}} — {{start_date}}'
    sortable_fields: [title, start_date, region, clown_level, medium]
    view_filters:
      - { label: UK, field: region, pattern: UK }
      - { label: Europe, field: region, pattern: Europe }
      - { label: North America, field: region, pattern: 'North America' }
      - { label: In-person, field: medium, pattern: In-person }
      - { label: Online, field: medium, pattern: Online }
    fields:
      - { label: ID, name: id, widget: string, hint: 'Stable id, e.g. uk/events/my-course-slug. The last segment is the public URL. When creating a listing, set the entry slug to that last segment.' }
      - { label: Title, name: title, widget: string }
      - label: Course type
        name: course
        widget: relation
        required: false
        collection: course-types
        value_field: id
        search_fields: [title, clown_level]
        display_fields: [title]
        dropdown_threshold: 0
        hint: 'Optional. Inherited fields below fill in from this course when left blank.'
      - { label: Source URL, name: source_url, widget: string, required: false }
      - { label: Start date, name: start_date, widget: datetime, type: date, required: false }
      - { label: End date, name: end_date, widget: datetime, type: date, required: false }
      - { label: Country, name: location_country, widget: string, required: false }
      - label: Region
        name: region
        widget: select
        required: false
        options: [UK, Europe, 'North America']
      - label: Venue
        name: venue
        widget: relation
        required: false
        collection: venues
        value_field: id
        search_fields: [name, location, address]
        display_fields: [name]
      - { label: Language, name: language, widget: string, required: false }
      - label: Facilitators
        name: facilitators
        widget: relation
        multiple: true
        required: false
        collection: people
        value_field: id
        search_fields: [name]
        display_fields: [name]
        hint: Leave blank to use the linked course.
      - { label: Clown level, name: clown_level, widget: string, required: false, hint: 'Leave blank to use the linked course. e.g. Clown 1, Masterclass, Introduction' }
      - { label: Prerequisites, name: prerequisites, widget: string, required: false, hint: Leave blank to use the linked course. }
      - label: Medium
        name: medium
        widget: select
        required: false
        options: [In-person, Online]
        hint: Leave blank to use the linked course.
      - { label: Maximum group size, name: maximum_group_size, widget: number, value_type: int, min: 1, required: false, hint: Leave blank to use the linked course. }
      - { label: Course fee, name: course_fee, widget: string, required: false, hint: Leave blank to use the linked course. }
      - { label: Deposit, name: course_fee_deposit, widget: string, required: false, hint: Leave blank to use the linked course. }
      - { label: Schedule, name: schedule, widget: text, required: false, hint: Leave blank to use the linked course. Markdown is allowed. }
      - { label: Course description, name: course_description, widget: text, required: false, hint: Leave blank to use the linked course. Markdown is allowed. }
      - { label: Accommodation and meals, name: accommodation_and_meals, widget: text, required: false, hint: Markdown is allowed. }

  - name: venues
    label: Venues
    label_singular: Venue
    icon: location_on
    folder: src/lib/data/venues
    create: true
    format: json
    extension: json
    identifier_field: name
    slug: '{{slug}}'
    summary: '{{name}}'
    fields:
      - { label: ID, name: id, widget: string, hint: 'URL slug used by courses, e.g. peredur-centre' }
      - { label: Name, name: name, widget: string }
      - { label: Address, name: address, widget: text, required: false }
      - { label: Location, name: location, widget: string, required: false, hint: 'Town or city shown on course listings' }
      - { label: Email, name: email, widget: string, required: false }
      - { label: Phone, name: phone, widget: string, required: false }

  - name: people
    label: People
    label_singular: Person
    icon: groups
    folder: src/lib/data/people
    create: true
    format: json
    extension: json
    identifier_field: name
    slug: '{{slug}}'
    summary: '{{name}}'
    sortable_fields: [name, region, person_type, status]
    fields:
      - { label: ID, name: id, widget: string, hint: 'URL slug used by courses, e.g. vivian-gladwell' }
      - { label: Name, name: name, widget: string }
      - label: Person type
        name: person_type
        widget: select
        options:
          - { label: Team facilitator, value: team-facilitator }
          - { label: Associate facilitator, value: associate-facilitator }
          - { label: In memory, value: team-passed-away }
      - label: Status
        name: status
        widget: select
        options:
          - { label: Active, value: active }
          - { label: Previous associate, value: previous-associate }
        default: active
      - { label: Country, name: country, widget: string, required: false }
      - label: Region
        name: region
        widget: select
        required: false
        options: [UK, Europe, 'North America']
      - { label: Photo URL, name: photo, widget: string, required: false }
      - { label: Background, name: background, widget: markdown, required: false }
      - label: Source URLs
        name: source_urls
        widget: list
        required: false
        field: { name: url, label: URL, widget: string }

  - name: testimonials
    label: Testimonials
    label_singular: Testimonial
    icon: format_quote
    folder: src/lib/data/testimonials
    create: true
    format: json
    extension: json
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}} — {{date}}'
    sortable_fields: [title, date]
    fields:
      - { label: ID, name: id, widget: string, hint: 'Stable id, e.g. uk/archives/1877. Set the entry slug to a short URL-friendly name.' }
      - { label: Title, name: title, widget: string, hint: 'Attribution line, e.g. R. K. Stroud, UK – Clown 1 March 2024' }
      - { label: Source URL, name: source_url, widget: string, required: false }
      - { label: Date, name: date, widget: datetime, type: date, required: false, hint: 'When the testimonial was published on the original site' }
      - { label: Quote, name: quote, widget: markdown, required: false }

  - divider: true

  - name: pages
    label: Pages
    files:
      - name: home-team
        label: Home — about us
        file: src/lib/content/pages/home-team.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown }
      - name: approach
        label: Approach
        file: src/lib/content/pages/approach.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown }
      - name: clown-programme
        label: Clown programme
        file: src/lib/content/pages/clown-programme.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown }
      - name: for-organisations
        label: For organisations
        file: src/lib/content/pages/for-organisations.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown }
      - name: how-to-book
        label: How to book
        file: src/lib/content/pages/how-to-book.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown }
      - name: articles-index
        label: Articles index
        file: src/lib/content/pages/articles.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown }
      - name: contact
        label: Contact us
        file: src/lib/content/pages/contact.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown }

  - name: articles
    label: Articles
    label_singular: Article
    folder: src/lib/content/articles
    create: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Source URL, name: source_url, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }
